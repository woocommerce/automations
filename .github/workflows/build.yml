# This is a basic workflow to help you get started with Actions

name: build

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the trunk branch
on:
  push:
    branches: [ trunk ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This will build the script and then commit and push the built file.
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
    - run: npm ci
    # run tests
    - run: npm run test
    # if tests pass then build.
    - run: npm run build
    - uses: stefanzweifel/git-auto-commit-action@3ea6ae190baf489ba007f7c92608f33ce20ef04a # v4
      with:
        commit_message: Update built file.
        commit_options: '--no-verify --signoff'
